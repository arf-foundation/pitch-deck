erty --tw-backdrop-invert{syntax:\"*\";inherits:false}@property --tw-backdrop-opacity{syntax:\"*\";inherits:false}@property --tw-backdrop-saturate{syntax:\"*\";inherits:false}@property --tw-backdrop-sepia{syntax:\"*\";inherits:false}@property --tw-duration{syntax:\"*\";inherits:false}@property --tw-ease{syntax:\"*\";inherits:false}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.5}}\n<\u002Fstyle><style>html,body{margin:0;background:#0e0d12}<\u002Fstyle><\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"125297e6-9e4e-4114-84e7-e5a25ccaea02#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" data-uneditable=\"\">\n<section data-label=\"Title\" data-screen-label=\"01 Title\" style=\"position:relative;overflow:hidden;box-sizing:border-box;background:#0e0d12;color:#faf9f7;font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;padding:80px 120px 120px\">\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(900px 420px at 16% 0,#3358e852,#0000 70%),radial-gradient(680px 380px at 92% 100%,#7a4be047,#0000 72%)\"><\u002Fdiv>\n<div data-orb=\"\" style=\"position:absolute;width:1000px;height:1000px;left:-260px;top:-460px;border-radius:50%;background:radial-gradient(circle,#3358e85c,#0000 62%);pointer-events:none\"><\u002Fdiv>\n<div data-orb=\"\" style=\"position:absolute;width:1100px;height:1100px;right:-320px;bottom:-560px;border-radius:50%;background:radial-gradient(circle,#7a4be052,#0000 62%);pointer-events:none\"><\u002Fdiv>\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#faf9f70b 1px,transparent 1px),linear-gradient(90deg,#faf9f70b 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 30%,#000 20%,transparent 80%);mask-image:radial-gradient(ellipse 80% 70% at 50% 30%,#000 20%,transparent 80%)\"><\u002Fdiv>\n<div style=\"position:relative;z-index:1;height:100%;display:flex;flex-direction:column\">\n<div style=\"display:flex;justify-content:space-between;align-items:center\">\n<img data-a=\"fade\" src=\"8f929f79-a651-450f-ab31-285a03e3dd40\" alt=\"ARF AI\" style=\"height:64px;width:auto;display:block\">\n<div data-a=\"fade\" style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#9a9997;padding:10px 22px;border:1px solid #faf9f71f;border-radius:999px;white-space:nowrap\">Non-confidential investor materials<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:80px;align-items:center;margin:auto 0\">\n<div>\n<div data-a=\"left\" style=\"display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#9a9997;margin-bottom:32px\"><span style=\"width:40px;height:2px;background:linear-gradient(90deg,#3358e8,#7a4be0)\"><\u002Fspan>Investor Overview · Pre-Seed<\u002Fdiv>\n<h1 data-a=\"mask\" style=\"margin:0 0 36px;font-size:120px;line-height:1;letter-spacing:-.04em;font-weight:600\">The <span style=\"font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.02em;background:linear-gradient(100deg,#6d88ff,#a47dff);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em\">Control Plane<\u002Fspan><br>for Autonomous AI<\u002Fh1>\n<p data-a=\"rise\" style=\"margin:0;font-size:30px;line-height:1.45;color:#c4c3c1;max-width:1080px;text-wrap:pretty\">ARF sits between agent intent and production execution, enforcing risk-aware decisioning, deterministic policy, trusted authorization, reversibility, and auditable execution before autonomous actions reach critical systems.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<div data-a=\"right\" style=\"background:#17161dcc;border:1px solid #faf9f71f;border-radius:20px;padding:28px 32px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\"><div data-count=\"\" style=\"font-size:64px;line-height:1;font-weight:600;letter-spacing:-.03em;margin-bottom:12px;background:linear-gradient(100deg,#6d88ff,#a47dff);-webkit-background-clip:text;background-clip:text;color:transparent\">536<\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.4;color:#c4c3c1\">tests passing in core CI, on Python 3.10–3.12<\u002Fp><\u002Fdiv>\n<div data-a=\"right\" style=\"background:#17161dcc;border:1px solid #faf9f71f;border-radius:20px;padding:28px 32px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\"><div data-count=\"\" style=\"font-size:64px;line-height:1;font-weight:600;letter-spacing:-.03em;margin-bottom:12px;background:linear-gradient(100deg,#6d88ff,#a47dff);-webkit-background-clip:text;background-clip:text;color:transparent\">772<\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.4;color:#c4c3c1\">tests passing in enterprise CI, plus 113 in Rust<\u002Fp><\u002Fdiv>\n<div data-a=\"right\" style=\"background:#17161dcc;border:1px solid #faf9f71f;border-radius:20px;padding:28px 32px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\"><div data-count=\"\" style=\"font-size:64px;line-height:1;font-weight:600;letter-spacing:-.03em;margin-bottom:12px;background:linear-gradient(100deg,#6d88ff,#a47dff);-webkit-background-clip:text;background-clip:text;color:transparent\">$500K<\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.4;color:#c4c3c1\">pre-seed raise · $250K first close<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n<span data-a=\"rise\" style=\"padding:10px 22px;border-radius:999px;border:1px solid #faf9f71f;background:#faf9f70a;font-size:24px;color:#d4d3d1;white-space:nowrap;flex-shrink:0\">Execution governance<\u002Fspan>\n<span data-a=\"rise\" style=\"padding:10px 22px;border-radius:999px;border:1px solid #faf9f71f;background:#faf9f70a;font-size:24px;color:#d4d3d1;white-space:nowrap;flex-shrink:0\">Bayesian risk<\u002Fspan>\n<span data-a=\"rise\" style=\"padding:10px 22px;border-radius:999px;border:1px solid #faf9f71f;background:#faf9f70a;font-size:24px;color:#d4d3d1;white-space:nowrap;flex-shrink:0\">Candidate selection<\u002Fspan>\n<span data-a=\"rise\" style=\"padding:10px 22px;border-radius:999px;border:1px solid #faf9f71f;background:#faf9f70a;font-size:24px;color:#d4d3d1;white-space:nowrap;flex-shrink:0\">Trusted signing<\u002Fspan>\n<span data-a=\"rise\" style=\"padding:10px 22px;border-radius:999px;border:1px solid #faf9f71f;background:#faf9f70a;font-size:24px;color:#d4d3d1;white-space:nowrap;flex-shrink:0\">Reversibility<\u002Fspan>\n<span data-a=\"rise\" style=\"padding:10px 22px;border-radius:999px;border:1px solid #faf9f71f;background:#faf9f70a;font-size:24px;color:#d4d3d1;white-space:nowrap;flex-shrink:0\">Auditability<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:absolute;left:120px;right:120px;bottom:44px;z-index:1;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#8a8987\"><span>Proprietary details reserved for diligence<\u002Fspan><span style=\"display:flex;align-items:center;gap:20px\"><span style=\"position:relative;width:160px;height:2px;background:#faf9f71f;overflow:hidden\"><span data-a=\"grow\" style=\"position:absolute;left:0;top:0;bottom:0;width:7.1%;background:linear-gradient(90deg,#3358e8,#7a4be0);transform-origin:left\"><\u002Fspan><\u002Fspan>01 / 14<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Problem\" data-screen-label=\"02 Problem\" style=\"position:relative;overflow:hidden;box-sizing:border-box;background:#0e0d12;color:#faf9f7;font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;padding:80px 120px 120px\">\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(900px 420px at 16% 0,#3358e852,#0000 70%),radial-gradient(680px 380px at 92% 100%,#7a4be047,#0000 72%)\"><\u002Fdiv>\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#faf9f70b 1px,transparent 1px),linear-gradient(90deg,#faf9f70b 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 20%,#000 20%,transparent 80%);mask-image:radial-gradient(ellipse 80% 70% at 50% 20%,#000 20%,transparent 80%)\"><\u002Fdiv>\n<div style=\"position:relative;z-index:1;height:100%;display:flex;flex-direction:column\">\n<div data-a=\"left\" style=\"display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#9a9997;margin-bottom:28px\"><span style=\"width:40px;height:2px;background:linear-gradient(90deg,#3358e8,#7a4be0)\"><\u002Fspan>The category problem<\u002Fdiv>\n<h2 data-a=\"mask\" style=\"margin:0 0 20px;font-size:60px;line-height:1.05;letter-spacing:-.03em;font-weight:600;max-width:1600px;text-wrap:balance\">AI is gaining the ability to act faster than enterprises can <em style=\"font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em\">govern<\u002Fem> it.<\u002Fh2>\n<p data-a=\"rise\" style=\"margin:0 0 32px;font-size:26px;line-height:1.42;color:#c4c3c1;max-width:1560px;text-wrap:pretty\">The risk is no longer limited to an incorrect answer. Once agents can modify infrastructure, trigger workflows, change configuration, or take other consequential actions, enterprises need controls before execution — not only observability after failure.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px\">\n<div data-a=\"rise\" style=\"display:flex;flex-direction:column;background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:28px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\">\n<div style=\"display:flex;align-items:center;gap:12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.08em;text-transform:uppercase;color:#9a9997;margin-bottom:12px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#fb2c36;box-shadow:0 0 12px #fb2c36\"><\u002Fspan>Air Canada · cited case<\u002Fdiv>\n<h3 style=\"margin:0 0 12px;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.01em;color:#faf9f7\">AI output became organizational liability.<\u002Fh3>\n<p style=\"margin:0 0 20px;font-size:24px;line-height:1.4;color:#c4c3c1\">A customer-facing AI response crossed the boundary between generated advice and an organizational commitment.<\u002Fp>\n<div style=\"margin-top:auto;padding-top:18px;border-top:1px solid #faf9f71f;font-size:24px;line-height:1.4;color:#e8e7e5\">Lesson: model output can become an operational and legal decision.<\u002Fdiv>\n<\u002Fdiv>\n<div data-a=\"rise\" style=\"display:flex;flex-direction:column;background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:28px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\">\n<div style=\"display:flex;align-items:center;gap:12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.08em;text-transform:uppercase;color:#9a9997;margin-bottom:12px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#fb2c36;box-shadow:0 0 12px #fb2c36\"><\u002Fspan>Cloudflare · cited case<\u002Fdiv>\n<h3 style=\"margin:0 0 12px;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.01em;color:#faf9f7\">A small configuration action can create systemic impact.<\u002Fh3>\n<p style=\"margin:0 0 20px;font-size:24px;line-height:1.4;color:#c4c3c1\">Infrastructure changes can propagate across large production surfaces.<\u002Fp>\n<div style=\"margin-top:auto;padding-top:18px;border-top:1px solid #faf9f71f;font-size:24px;line-height:1.4;color:#e8e7e5\">Lesson: reliability requires controls before execution, not only monitoring after failure.<\u002Fdiv>\n<\u002Fdiv>\n<div data-a=\"rise\" style=\"display:flex;flex-direction:column;background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:28px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\">\n<div style=\"display:flex;align-items:center;gap:12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.08em;text-transform:uppercase;color:#9a9997;margin-bottom:12px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#fb2c36;box-shadow:0 0 12px #fb2c36\"><\u002Fspan>PocketOS · cited case<\u002Fdiv>\n<h3 style=\"margin:0 0 12px;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.01em;color:#faf9f7\">Excessive autonomy can multiply blast radius.<\u002Fh3>\n<p style=\"margin:0 0 20px;font-size:24px;line-height:1.4;color:#c4c3c1\">A highly privileged autonomous workflow can turn a local mistake into a destructive event.<\u002Fp>\n<div style=\"margin-top:auto;padding-top:18px;border-top:1px solid #faf9f71f;font-size:24px;line-height:1.4;color:#e8e7e5\">Lesson: autonomy needs bounded permissions, selection, and recovery paths.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div data-a=\"rise\" style=\"margin-top:auto;padding:24px 36px;border-radius:20px;background:linear-gradient(100deg,#3358e824,#7a4be01a);border:1px solid #6d88ff3d;font-size:26px;line-height:1.4;color:#e8e7e5\"><strong style=\"color:#faf9f7;font-weight:600\">Category thesis:<\u002Fstrong> as agents become actors, execution governance becomes a distinct infrastructure requirement.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:absolute;left:120px;right:120px;bottom:44px;z-index:1;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#8a8987\"><span>ARF AI · Investor Deck<\u002Fspan><span style=\"display:flex;align-items:center;gap:20px\"><span style=\"position:relative;width:160px;height:2px;background:#faf9f71f;overflow:hidden\"><span data-a=\"grow\" style=\"position:absolute;left:0;top:0;bottom:0;width:14.3%;background:linear-gradient(90deg,#3358e8,#7a4be0);transform-origin:left\"><\u002Fspan><\u002Fspan>02 / 14<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Thesis\" data-screen-label=\"03 Thesis\" style=\"position:relative;overflow:hidden;box-sizing:border-box;background:#faf9f7;color:#191816;font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;padding:80px 120px 120px\">\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1100px 560px at 18% -10%,#3358e829,#0000 66%),radial-gradient(760px 460px at 92% 20%,#7a4be024,#0000 70%)\"><\u002Fdiv>\n<div style=\"position:relative;z-index:1;height:100%;display:flex;flex-direction:column\">\n<div data-a=\"left\" style=\"display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#605c54;margin-bottom:28px\"><span style=\"width:40px;height:2px;background:linear-gradient(90deg,#3358e8,#7a4be0)\"><\u002Fspan>Why this is a new layer<\u002Fdiv>\n<div data-a=\"mask\" style=\"font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400;font-size:112px;line-height:1.04;letter-spacing:-.025em;color:#191816;max-width:1560px;margin:0 0 20px;text-wrap:balance\">“The real problem is not capability — it is <span style=\"background:linear-gradient(100deg,#3358e8,#7a4be0);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em\">control.<\u002Fspan>”<\u002Fdiv>\n<div data-a=\"fade\" style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:#605c54;margin-bottom:56px\">— ARF product thesis<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px\">\n<div data-a=\"rise\" style=\"background:#fff;border:1px solid #19181617;border-radius:20px;padding:28px;box-shadow:0 2px 4px #19181608,0 20px 44px -28px #1918166b\"><div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;color:#3358e8;margin-bottom:20px\">01<\u002Fdiv><h3 style=\"margin:0 0 12px;font-size:32px;line-height:1.15;font-weight:600;letter-spacing:-.015em;color:#191816\">Evaluate<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.4;color:#56534d\">Quantify risk, consequence, uncertainty, and available evidence before release.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#fff;border:1px solid #19181617;border-radius:20px;padding:28px;box-shadow:0 2px 4px #19181608,0 20px 44px -28px #1918166b\"><div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;color:#3358e8;margin-bottom:20px\">02<\u002Fdiv><h3 style=\"margin:0 0 12px;font-size:32px;line-height:1.15;font-weight:600;letter-spacing:-.015em;color:#191816\">Authorize<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.4;color:#56534d\">Apply deterministic policies, permissions, signing, and autonomy boundaries at execution time.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#fff;border:1px solid #19181617;border-radius:20px;padding:28px;box-shadow:0 2px 4px #19181608,0 20px 44px -28px #1918166b\"><div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;color:#3358e8;margin-bottom:20px\">03<\u002Fdiv><h3 style=\"margin:0 0 12px;font-size:32px;line-height:1.15;font-weight:600;letter-spacing:-.015em;color:#191816\">Recover<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.4;color:#56534d\">Treat reversibility and compensation as part of the decision rather than an afterthought.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#fff;border:1px solid #19181617;border-radius:20px;padding:28px;box-shadow:0 2px 4px #19181608,0 20px 44px -28px #1918166b\"><div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;color:#3358e8;margin-bottom:20px\">04<\u002Fdiv><h3 style=\"margin:0 0 12px;font-size:32px;line-height:1.15;font-weight:600;letter-spacing:-.015em;color:#191816\">Prove<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.4;color:#56534d\">Record the proposed action, selected action, decision basis, and execution outcome for review.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div data-a=\"rise\" style=\"margin-top:auto;padding:24px 36px;border-radius:20px;background:linear-gradient(100deg,#3358e814,#7a4be00f);border:1px solid #3358e833;font-size:26px;line-height:1.4;color:#191816\">Think of ARF as <strong style=\"font-weight:600\">execution governance for agents<\u002Fstrong> — the control layer between probabilistic intent and production state.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:absolute;left:120px;right:120px;bottom:44px;z-index:1;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#605c54\"><span>ARF AI · Investor Deck<\u002Fspan><span style=\"display:flex;align-items:center;gap:20px\"><span style=\"position:relative;width:160px;height:2px;background:#19181617;overflow:hidden\"><span data-a=\"grow\" style=\"position:absolute;left:0;top:0;bottom:0;width:21.4%;background:linear-gradient(90deg,#3358e8,#7a4be0);transform-origin:left\"><\u002Fspan><\u002Fspan>03 / 14<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Architecture\" data-screen-label=\"04 Architecture\" style=\"position:relative;overflow:hidden;box-sizing:border-box;background:#0e0d12;color:#faf9f7;font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;padding:80px 120px 120px\">\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(900px 420px at 16% 0,#3358e852,#0000 70%),radial-gradient(680px 380px at 92% 100%,#7a4be047,#0000 72%)\"><\u002Fdiv>\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#faf9f70b 1px,transparent 1px),linear-gradient(90deg,#faf9f70b 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,#000 20%,transparent 80%);mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,#000 20%,transparent 80%)\"><\u002Fdiv>\n<div style=\"position:relative;z-index:1;height:100%;display:flex;flex-direction:column\">\n<div data-a=\"left\" style=\"display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#9a9997;margin-bottom:28px\"><span style=\"width:40px;height:2px;background:linear-gradient(90deg,#3358e8,#7a4be0)\"><\u002Fspan>Product architecture<\u002Fdiv>\n<h2 data-a=\"mask\" style=\"margin:0 0 20px;font-size:60px;line-height:1.05;letter-spacing:-.03em;font-weight:600;max-width:1600px;text-wrap:balance\">ARF separates candidate choice, safety gating, and <em style=\"font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em\">execution<\u002Fem>.<\u002Fh2>\n<p data-a=\"rise\" style=\"margin:0 0 36px;font-size:26px;line-height:1.42;color:#c4c3c1;max-width:1560px;text-wrap:pretty\">The current enterprise layer no longer relies on simulated legacy branching. Candidate alternatives are generated and scored upstream, the execution layer selects among scored options, and the selected candidate is the one the gates authorize and the actuator executes.<\u002Fp>\n<div class=\"arf-pipeline arf-pipeline-in\" style=\"display:flex;align-items:stretch;margin-bottom:28px\">\n<div data-a=\"left\" style=\"width:300px;flex-shrink:0;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;text-align:center;background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:24px\"><strong style=\"font-size:30px;font-weight:600;margin-bottom:8px\">Signed Intent<\u002Fstrong><span style=\"font-size:24px;line-height:1.35;color:#c4c3c1\">agent request + context + declared constraints<\u002Fspan><\u002Fdiv>\n<span class=\"arf-pipeline-wire\" style=\"width:72px;height:2px;margin:0 8px;align-self:center;flex-shrink:0\"><\u002Fspan>\n<div class=\"arf-pipeline-cluster\" style=\"flex:1;padding:22px 26px;gap:18px;border-radius:20px;background:#3358e80f\">\n<div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:#9fb0ff\">Candidate + Governance Path<\u002Fdiv>\n<div style=\"display:flex;align-items:center\">\n<div data-a=\"scale\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 8px;border-radius:14px;background:#1d1c25;border:1px solid #faf9f71f;font-size:24px;font-weight:600\"><span class=\"arf-pipeline-node-ring\" style=\"--i:0;width:40px;height:40px;margin:0\"><span style=\"width:10px;height:10px;border-radius:50%;background:#6d88ff;box-shadow:0 0 10px #6d88ff\"><\u002Fspan><\u002Fspan>Generate<\u002Fdiv>\n<span class=\"arf-pipeline-wire\" style=\"width:20px;height:2px;margin:0;flex-shrink:0\"><\u002Fspan>\n<div data-a=\"scale\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 8px;border-radius:14px;background:#1d1c25;border:1px solid #faf9f71f;font-size:24px;font-weight:600\"><span class=\"arf-pipeline-node-ring\" style=\"--i:1;width:40px;height:40px;margin:0\"><span style=\"width:10px;height:10px;border-radius:50%;background:#6d88ff;box-shadow:0 0 10px #6d88ff\"><\u002Fspan><\u002Fspan>Score<\u002Fdiv>\n<span class=\"arf-pipeline-wire\" style=\"width:20px;height:2px;margin:0;flex-shrink:0\"><\u002Fspan>\n<div data-a=\"scale\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 8px;border-radius:14px;background:#1d1c25;border:1px solid #faf9f71f;font-size:24px;font-weight:600\"><span class=\"arf-pipeline-node-ring\" style=\"--i:2;width:40px;height:40px;margin:0\"><span style=\"width:10px;height:10px;border-radius:50%;background:#8a7bff;box-shadow:0 0 10px #8a7bff\"><\u002Fspan><\u002Fspan>Select<\u002Fdiv>\n<span class=\"arf-pipeline-wire\" style=\"width:20px;height:2px;margin:0;flex-shrink:0\"><\u002Fspan>\n<div data-a=\"scale\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 8px;border-radius:14px;background:#1d1c25;border:1px solid #faf9f71f;font-size:24px;font-weight:600\"><span class=\"arf-pipeline-node-ring\" style=\"--i:3;width:40px;height:40px;margin:0\"><span style=\"width:10px;height:10px;border-radius:50%;background:#a47dff;box-shadow:0 0 10px #a47dff\"><\u002Fspan><\u002Fspan>Gate<\u002Fdiv>\n<span class=\"arf-pipeline-wire\" style=\"width:20px;height:2px;margin:0;flex-shrink:0\"><\u002Fspan>\n<div data-a=\"scale\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 8px;border-radius:14px;background:#1d1c25;border:1px solid #faf9f71f;font-size:24px;font-weight:600\"><span class=\"arf-pipeline-node-ring\" style=\"--i:4;width:40px;height:40px;margin:0\"><span style=\"width:10px;height:10px;border-radius:50%;background:#a47dff;box-shadow:0 0 10px #a47dff\"><\u002Fspan><\u002Fspan>Approve<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<span class=\"arf-pipeline-wire\" style=\"width:72px;height:2px;margin:0 8px;align-self:center;flex-shrink:0\"><\u002Fspan>\n<div data-a=\"right\" style=\"width:300px;flex-shrink:0;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;text-align:center;background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:24px\"><strong style=\"font-size:30px;font-weight:600;margin-bottom:8px\">Actuator<\u002Fstrong><span style=\"font-size:24px;line-height:1.35;color:#c4c3c1\">only the selected, authorized action executes<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px\">\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:24px 28px\"><div style=\"display:flex;align-items:center;gap:12px;font-size:28px;font-weight:600;margin-bottom:8px\"><span style=\"width:12px;height:12px;border-radius:50%;background:#05df72;box-shadow:0 0 12px #05df72\"><\u002Fspan>Advisory<\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.4;color:#c4c3c1\">Provide a governed recommendation without production authority.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:24px 28px\"><div style=\"display:flex;align-items:center;gap:12px;font-size:28px;font-weight:600;margin-bottom:8px\"><span style=\"width:12px;height:12px;border-radius:50%;background:#f99c00;box-shadow:0 0 12px #f99c00\"><\u002Fspan>Supervised<\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.4;color:#c4c3c1\">Route the selected action through an explicit approval boundary.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:24px 28px\"><div style=\"display:flex;align-items:center;gap:12px;font-size:28px;font-weight:600;margin-bottom:8px\"><span style=\"width:12px;height:12px;border-radius:50%;background:#fb2c36;box-shadow:0 0 12px #fb2c36\"><\u002Fspan>Autonomous<\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.4;color:#c4c3c1\">Permit execution only where policy, risk, trust, and recovery constraints allow it.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div data-a=\"rise\" style=\"margin-top:auto;padding:22px 36px;border-radius:20px;background:linear-gradient(100deg,#3358e824,#7a4be01a);border:1px solid #6d88ff3d;font-size:26px;line-height:1.4;color:#e8e7e5\"><strong style=\"color:#faf9f7;font-weight:600\">Key invariant:<\u002Fstrong> gates, approval requirements, and audit records describe the same selected candidate that the executor ultimately actuates.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:absolute;left:120px;right:120px;bottom:44px;z-index:1;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#8a8987\"><span>ARF AI · Investor Deck<\u002Fspan><span style=\"display:flex;align-items:center;gap:20px\"><span style=\"position:relative;width:160px;height:2px;background:#faf9f71f;overflow:hidden\"><span data-a=\"grow\" style=\"position:absolute;left:0;top:0;bottom:0;width:28.6%;background:linear-gradient(90deg,#3358e8,#7a4be0);transform-origin:left\"><\u002Fspan><\u002Fspan>04 / 14<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Differentiation\" data-screen-label=\"05 Differentiation\" style=\"position:relative;overflow:hidden;box-sizing:border-box;background:#0e0d12;color:#faf9f7;font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;padding:80px 120px 120px\">\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(900px 420px at 16% 0,#3358e852,#0000 70%),radial-gradient(680px 380px at 92% 100%,#7a4be047,#0000 72%)\"><\u002Fdiv>\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#faf9f70b 1px,transparent 1px),linear-gradient(90deg,#faf9f70b 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 20%,#000 20%,transparent 80%);mask-image:radial-gradient(ellipse 80% 70% at 50% 20%,#000 20%,transparent 80%)\"><\u002Fdiv>\n<div style=\"position:relative;z-index:1;height:100%;display:flex;flex-direction:column\">\n<div data-a=\"left\" style=\"display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#9a9997;margin-bottom:28px\"><span style=\"width:40px;height:2px;background:linear-gradient(90deg,#3358e8,#7a4be0)\"><\u002Fspan>Technical differentiation<\u002Fdiv>\n<h2 data-a=\"mask\" style=\"margin:0 0 36px;font-size:60px;line-height:1.05;letter-spacing:-.03em;font-weight:600;max-width:1600px;text-wrap:balance\"><em style=\"font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em\">Probabilistic<\u002Fem> intelligence feeding <em style=\"font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em\">deterministic<\u002Fem> execution governance.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px\">\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:26px 28px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\"><h3 style=\"margin:0 0 10px;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.01em;color:#faf9f7\">Bayesian risk fusion<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.38;color:#c4c3c1\">Conjugate online updates, optional hierarchical shrinkage, and offline HMC prediction combine into a risk estimate that evolves as evidence accumulates.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:26px 28px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\"><h3 style=\"margin:0 0 10px;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.01em;color:#faf9f7\">Expected loss + CVaR<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.38;color:#c4c3c1\">Approval, denial, and escalation are selected by expected-loss minimization, with the 95% CVaR tail used by default to account for adverse outcomes.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:26px 28px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\"><h3 style=\"margin:0 0 10px;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.01em;color:#faf9f7\">Epistemic uncertainty<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.38;color:#c4c3c1\">Hallucination, forecast uncertainty, and data sparsity are combined into a bounded uncertainty measure with Shapley attribution.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:26px 28px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\"><h3 style=\"margin:0 0 10px;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.01em;color:#faf9f7\">Semantic memory<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.38;color:#c4c3c1\">FAISS-backed incident retrieval can adjust risk using evidence from prior outcomes, with learned or Bayesian memory weights.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:26px 28px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\"><h3 style=\"margin:0 0 10px;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.01em;color:#faf9f7\">Causal counterfactuals<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.38;color:#c4c3c1\">The core advisory layer includes IPW and heterogeneous treatment-effect machinery for explaining alternative decisions and their observed outcomes.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:26px 28px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\"><h3 style=\"margin:0 0 10px;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.01em;color:#faf9f7\">Formal verification<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.38;color:#c4c3c1\">Policy algebra is model-checked in TLA+ and property-tested across Python and Rust on the permit/deny decision projection.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:auto\">\n<span data-a=\"rise\" style=\"padding:10px 22px;border-radius:999px;border:1px solid #faf9f71f;background:#faf9f70a;font-size:24px;color:#d4d3d1;white-space:nowrap;flex-shrink:0\">AGSF online risk tracking<\u002Fspan>\n<span data-a=\"rise\" style=\"padding:10px 22px;border-radius:999px;border:1px solid #faf9f71f;background:#faf9f70a;font-size:24px;color:#d4d3d1;white-space:nowrap;flex-shrink:0\">Temporal drift detection<\u002Fspan>\n<span data-a=\"rise\" style=\"padding:10px 22px;border-radius:999px;border:1px solid #faf9f71f;background:#faf9f70a;font-size:24px;color:#d4d3d1;white-space:nowrap;flex-shrink:0\">Lyapunov stability monitoring<\u002Fspan>\n<span data-a=\"rise\" style=\"padding:10px 22px;border-radius:999px;border:1px solid #faf9f71f;background:#faf9f70a;font-size:24px;color:#d4d3d1;white-space:nowrap;flex-shrink:0\">Deterministic seeded sampling<\u002Fspan>\n<span data-a=\"rise\" style=\"padding:10px 22px;border-radius:999px;border:1px solid #faf9f71f;background:#faf9f70a;font-size:24px;color:#d4d3d1;white-space:nowrap;flex-shrink:0\">Immutable HealingIntent contract<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:absolute;left:120px;right:120px;bottom:44px;z-index:1;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#8a8987\"><span>ARF AI · Investor Deck<\u002Fspan><span style=\"display:flex;align-items:center;gap:20px\"><span style=\"position:relative;width:160px;height:2px;background:#faf9f71f;overflow:hidden\"><span data-a=\"grow\" style=\"position:absolute;left:0;top:0;bottom:0;width:35.7%;background:linear-gradient(90deg,#3358e8,#7a4be0);transform-origin:left\"><\u002Fspan><\u002Fspan>05 / 14<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Signed intent\" data-screen-label=\"06 Signed intent\" style=\"position:relative;overflow:hidden;box-sizing:border-box;background:#0e0d12;color:#faf9f7;font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;padding:80px 120px 120px\">\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(900px 480px at 80% 30%,#3358e847,#0000 70%),radial-gradient(680px 380px at 10% 100%,#7a4be040,#0000 72%)\"><\u002Fdiv>\n<div style=\"position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 900px;gap:88px;align-items:center\">\n<div>\n<div data-a=\"left\" style=\"display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#9a9997;margin-bottom:36px\"><span style=\"width:40px;height:2px;background:linear-gradient(90deg,#3358e8,#7a4be0)\"><\u002Fspan>Signed intent boundary<\u002Fdiv>\n<p data-a=\"mask\" style=\"margin:0;font-size:50px;line-height:1.16;letter-spacing:-.025em;font-weight:500;color:#faf9f7;text-wrap:pretty\">The core <em style=\"font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400\">probabilistic<\u002Fem> layer estimates risk and uncertainty; the enterprise layer applies <em style=\"font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400;background:linear-gradient(100deg,#6d88ff,#a47dff);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em\">deterministic<\u002Fem> policy, trust, approval, and execution controls to the resulting decision.<\u002Fp>\n<\u002Fdiv>\n<div data-a=\"scale\" style=\"position:relative;overflow:hidden;background:#0a0a0e;border:1px solid #faf9f71f;border-radius:24px;box-shadow:0 40px 120px -40px #3358e880,0 2px 4px #0006\">\n<div data-scan=\"\" style=\"position:absolute;left:0;right:0;top:0;height:140px;pointer-events:none;background:linear-gradient(180deg,#0000,#6d88ff14,#0000)\"><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;padding:22px 32px;border-bottom:1px solid #faf9f71f;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;color:#9a9997\"><span>Illustrative signed intent<\u002Fspan><span style=\"padding:6px 16px;border-radius:999px;border:1px solid #6d88ff66;color:#c9d2ff;background:#3358e81f\">Ed25519<\u002Fspan><\u002Fdiv>\n<div style=\"padding:28px 0 32px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:26px;line-height:1.75;color:#8a8987\">\n<div data-a=\"left\" style=\"padding:0 36px\">{<\u002Fdiv>\n<div data-a=\"left\" style=\"padding:0 36px 0 76px\"><span style=\"color:#9fb0ff\">\"intent_id\"<\u002Fspan>: <span style=\"color:#e8e7e5\">\"123\"<\u002Fspan>,<\u002Fdiv>\n<div data-a=\"left\" style=\"padding:0 36px 0 76px\"><span style=\"color:#9fb0ff\">\"action\"<\u002Fspan>: <span style=\"color:#e8e7e5\">\"restart_container\"<\u002Fspan>,<\u002Fdiv>\n<div data-a=\"left\" style=\"padding:0 36px 0 76px\"><span style=\"color:#9fb0ff\">\"risk_score\"<\u002Fspan>: <span style=\"color:#c9a8ff\">0.20<\u002Fspan>,<\u002Fdiv>\n<div data-a=\"left\" style=\"padding:0 36px 0 76px\"><span style=\"color:#9fb0ff\">\"requires_enterprise\"<\u002Fspan>: <span style=\"color:#5eeaa0\">true<\u002Fspan>,<\u002Fdiv>\n<div data-a=\"left\" style=\"padding:0 36px 0 76px;background:linear-gradient(90deg,#3358e833,#7a4be014 60%,#0000)\"><span style=\"color:#9fb0ff\">\"signature\"<\u002Fspan>: <span style=\"color:#faf9f7\">\"Ed25519:...\"<\u002Fspan>,<\u002Fdiv>\n<div data-a=\"left\" style=\"padding:0 36px 0 76px\"><span style=\"color:#9fb0ff\">\"public_key_fingerprint\"<\u002Fspan>: <span style=\"color:#e8e7e5\">\"...\"<\u002Fspan>,<\u002Fdiv>\n<div data-a=\"left\" style=\"padding:0 36px 0 76px\"><span style=\"color:#9fb0ff\">\"context_hash\"<\u002Fspan>: <span style=\"color:#e8e7e5\">\"sha256:...\"<\u002Fspan><\u002Fdiv>\n<div data-a=\"left\" style=\"padding:0 36px\">}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:absolute;left:120px;right:120px;bottom:44px;z-index:1;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#8a8987\"><span>ARF AI · Investor Deck<\u002Fspan><span style=\"display:flex;align-items:center;gap:20px\"><span style=\"position:relative;width:160px;height:2px;background:#faf9f71f;overflow:hidden\"><span data-a=\"grow\" style=\"position:absolute;left:0;top:0;bottom:0;width:42.9%;background:linear-gradient(90deg,#3358e8,#7a4be0);transform-origin:left\"><\u002Fspan><\u002Fspan>06 / 14<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Defensibility\" data-screen-label=\"07 Defensibility\" style=\"position:relative;overflow:hidden;box-sizing:border-box;background:#0e0d12;color:#faf9f7;font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;padding:80px 120px 120px\">\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(900px 420px at 16% 0,#3358e852,#0000 70%),radial-gradient(680px 380px at 92% 100%,#7a4be047,#0000 72%)\"><\u002Fdiv>\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#faf9f70b 1px,transparent 1px),linear-gradient(90deg,#faf9f70b 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 20%,#000 20%,transparent 80%);mask-image:radial-gradient(ellipse 80% 70% at 50% 20%,#000 20%,transparent 80%)\"><\u002Fdiv>\n<div style=\"position:relative;z-index:1;height:100%;display:flex;flex-direction:column\">\n<div data-a=\"left\" style=\"display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#9a9997;margin-bottom:28px\"><span style=\"width:40px;height:2px;background:linear-gradient(90deg,#3358e8,#7a4be0)\"><\u002Fspan>Defensibility &amp; IP<\u002Fdiv>\n<h2 data-a=\"mask\" style=\"margin:0 0 36px;font-size:56px;line-height:1.06;letter-spacing:-.03em;font-weight:600;max-width:1640px;text-wrap:balance\">ARF's moat is a <em style=\"font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em\">protected execution runtime<\u002Fem> plus the policy, risk, and integration layer around it.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px\">\n<div data-a=\"rise\" style=\"border:2px solid transparent;border-radius:20px;padding:28px;background:linear-gradient(#17161d,#17161d) padding-box,linear-gradient(135deg,#3358e8,#7a4be0) border-box;box-shadow:0 30px 80px -40px #3358e899\">\n<h3 style=\"margin:0 0 18px;font-size:28px;line-height:1.2;font-weight:600;color:#faf9f7\">Proprietary / access-controlled<\u002Fh3>\n<div style=\"display:flex;flex-direction:column;gap:10px;font-size:24px;line-height:1.32;color:#d4d3d1\">\n<div style=\"display:flex;gap:14px\"><span style=\"flex-shrink:0;width:8px;height:8px;margin-top:12px;border-radius:2px;background:linear-gradient(135deg,#6d88ff,#a47dff)\"><\u002Fspan>Protected core engine<\u002Fdiv>\n<div style=\"display:flex;gap:14px\"><span style=\"flex-shrink:0;width:8px;height:8px;margin-top:12px;border-radius:2px;background:linear-gradient(135deg,#6d88ff,#a47dff)\"><\u002Fspan>Enterprise execution layer<\u002Fdiv>\n<div style=\"display:flex;gap:14px\"><span style=\"flex-shrink:0;width:8px;height:8px;margin-top:12px;border-radius:2px;background:linear-gradient(135deg,#6d88ff,#a47dff)\"><\u002Fspan>Risk / governance implementation<\u002Fdiv>\n<div style=\"display:flex;gap:14px\"><span style=\"flex-shrink:0;width:8px;height:8px;margin-top:12px;border-radius:2px;background:linear-gradient(135deg,#6d88ff,#a47dff)\"><\u002Fspan>Trusted signing and candidate-selection runtime<\u002Fdiv>\n<div style=\"display:flex;gap:14px\"><span style=\"flex-shrink:0;width:8px;height:8px;margin-top:12px;border-radius:2px;background:linear-gradient(135deg,#6d88ff,#a47dff)\"><\u002Fspan>Private APIs, deployment logic, and internal specifications<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:28px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\">\n<h3 style=\"margin:0 0 18px;font-size:28px;line-height:1.2;font-weight:600;color:#faf9f7\">Public / controlled ecosystem<\u002Fh3>\n<div style=\"display:flex;flex-direction:column;gap:10px;font-size:24px;line-height:1.32;color:#d4d3d1\">\n<div style=\"display:flex;gap:14px\"><span style=\"flex-shrink:0;width:8px;height:8px;margin-top:12px;border-radius:2px;background:#8a8987\"><\u002Fspan>Presentation and documentation<\u002Fdiv>\n<div style=\"display:flex;gap:14px\"><span style=\"flex-shrink:0;width:8px;height:8px;margin-top:12px;border-radius:2px;background:#8a8987\"><\u002Fspan>Sanitized risk demonstrations<\u002Fdiv>\n<div style=\"display:flex;gap:14px\"><span style=\"flex-shrink:0;width:8px;height:8px;margin-top:12px;border-radius:2px;background:#8a8987\"><\u002Fspan>Selected specification / interface material<\u002Fdiv>\n<div style=\"display:flex;gap:14px\"><span style=\"flex-shrink:0;width:8px;height:8px;margin-top:12px;border-radius:2px;background:#8a8987\"><\u002Fspan>Public organization and integration entry points<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:28px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\">\n<h3 style=\"margin:0 0 18px;font-size:28px;line-height:1.2;font-weight:600;color:#faf9f7\">Compounding advantage<\u002Fh3>\n<div style=\"display:flex;flex-direction:column;gap:10px;font-size:24px;line-height:1.32;color:#d4d3d1\">\n<div style=\"display:flex;gap:14px\"><span style=\"flex-shrink:0;width:8px;height:8px;margin-top:12px;border-radius:2px;background:#a47dff\"><\u002Fspan>Governance policy libraries<\u002Fdiv>\n<div style=\"display:flex;gap:14px\"><span style=\"flex-shrink:0;width:8px;height:8px;margin-top:12px;border-radius:2px;background:#a47dff\"><\u002Fspan>Action / outcome history<\u002Fdiv>\n<div style=\"display:flex;gap:14px\"><span style=\"flex-shrink:0;width:8px;height:8px;margin-top:12px;border-radius:2px;background:#a47dff\"><\u002Fspan>Risk calibration by category and environment<\u002Fdiv>\n<div style=\"display:flex;gap:14px\"><span style=\"flex-shrink:0;width:8px;height:8px;margin-top:12px;border-radius:2px;background:#a47dff\"><\u002Fspan>Enterprise integrations and execution footprint<\u002Fdiv>\n<div style=\"display:flex;gap:14px\"><span style=\"flex-shrink:0;width:8px;height:8px;margin-top:12px;border-radius:2px;background:#a47dff\"><\u002Fspan>Operational knowledge accumulated at the control boundary<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div data-a=\"rise\" style=\"margin-top:auto;padding:22px 36px;border-radius:20px;background:linear-gradient(100deg,#3358e824,#7a4be01a);border:1px solid #6d88ff3d;font-size:24px;line-height:1.42;color:#e8e7e5\"><strong style=\"color:#faf9f7;font-weight:600\">Engineering axioms:<\u002Fstrong> risk, policy, and reversibility remain distinct; the selected action is the governed action; missing evidence is not treated as evidence of safety; and the audit trail should never assert data the runtime did not retain.<\u002Fdiv>\n<p data-a=\"fade\" style=\"margin:16px 0 0;font-size:24px;line-height:1.4;color:#8a8987\">This deck does not claim patent protection. Formal diligence can distinguish company-owned software and methods, third-party dependencies, and any filed or registered IP.<\u002Fp>\n<\u002Fdiv>\n<div style=\"position:absolute;left:120px;right:120px;bottom:44px;z-index:1;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#8a8987\"><span>ARF AI · Investor Deck<\u002Fspan><span style=\"display:flex;align-items:center;gap:20px\"><span style=\"position:relative;width:160px;height:2px;background:#faf9f71f;overflow:hidden\"><span data-a=\"grow\" style=\"position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#3358e8,#7a4be0);transform-origin:left\"><\u002Fspan><\u002Fspan>07 / 14<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Platform\" data-screen-label=\"08 Platform\" style=\"position:relative;overflow:hidden;box-sizing:border-box;background:#0e0d12;color:#faf9f7;font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;padding:80px 120px 120px\">\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(900px 520px at 75% 30%,#3358e847,#0000 70%),radial-gradient(680px 380px at 8% 100%,#7a4be040,#0000 72%)\"><\u002Fdiv>\n<div style=\"position:relative;z-index:1;height:100%;display:flex;flex-direction:column\">\n<div style=\"display:grid;grid-template-columns:680px minmax(0,1fr);gap:80px;align-items:start\">\n<div>\n<div data-a=\"left\" style=\"display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#9a9997;margin-bottom:28px\"><span style=\"width:40px;height:2px;background:linear-gradient(90deg,#3358e8,#7a4be0)\"><\u002Fspan>Platform thesis<\u002Fdiv>\n<h2 data-a=\"mask\" style=\"margin:0 0 24px;font-size:52px;line-height:1.07;letter-spacing:-.03em;font-weight:600;text-wrap:balance\">ARF is designed to become a standard <em style=\"font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em\">control boundary<\u002Fem> for high-consequence autonomous systems.<\u002Fh2>\n<p data-a=\"rise\" style=\"margin:0;font-size:26px;line-height:1.42;color:#c4c3c1;text-wrap:pretty\">Models generate intelligence. Agents coordinate action. ARF governs what crosses into production. The architecture is deliberately orthogonal to the model or application layer.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div data-a=\"up\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center;padding:20px 28px;border-radius:18px;background:#17161d;border:1px solid #faf9f71f\"><span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:#9a9997\">Model layer<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#c4c3c1\">Generates predictions, plans, and language.<\u002Fspan><\u002Fdiv>\n<div data-a=\"up\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center;padding:20px 28px;border-radius:18px;background:#17161d;border:1px solid #faf9f71f\"><span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:#9a9997\">Agent layer<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#c4c3c1\">Coordinates tools, context, workflows, and proposed actions.<\u002Fspan><\u002Fdiv>\n<div data-a=\"scale\" data-pulse=\"\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center;padding:24px 28px;border-radius:18px;border:2px solid transparent;background:linear-gradient(100deg,#1d1c3a,#221a36) padding-box,linear-gradient(100deg,#3358e8,#7a4be0) border-box\"><span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:#c9d2ff;font-weight:500\">ARF layer<\u002Fspan><strong style=\"font-size:26px;line-height:1.35;font-weight:600;color:#faf9f7\">Evaluates, selects, constrains, authorizes, logs, and governs execution.<\u002Fstrong><\u002Fdiv>\n<div data-a=\"up\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center;padding:20px 28px;border-radius:18px;background:#17161d;border:1px solid #faf9f71f\"><span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:#9a9997\">System layer<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#c4c3c1\">Cloud infrastructure, business systems, financial workflows, healthcare operations, and other production environments.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:auto\">\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:26px 28px\"><h3 style=\"margin:0 0 10px;font-size:28px;line-height:1.2;font-weight:600;color:#faf9f7\">Not another observability dashboard<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.36;color:#c4c3c1\">ARF is positioned at the pre-execution boundary, where an organization can still prevent an unsafe action rather than only explain it afterward.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:26px 28px\"><h3 style=\"margin:0 0 10px;font-size:28px;line-height:1.2;font-weight:600;color:#faf9f7\">Why the layer can persist<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.36;color:#c4c3c1\">Once many different agents operate across the same environment, a common governance boundary can become more valuable than governance implemented independently inside every agent.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"padding:26px 28px;border-radius:20px;background:linear-gradient(135deg,#3358e824,#7a4be01a);border:1px solid #6d88ff3d;font-size:24px;line-height:1.36;color:#e8e7e5\"><strong style=\"color:#faf9f7;font-weight:600\">Positioning:<\u002Fstrong> model guardrails protect prompts and outputs; observability explains what happened; ARF is designed to govern whether a consequential action should cross the execution boundary. Analogy: <strong style=\"color:#faf9f7;font-weight:600\">service mesh for agent execution<\u002Fstrong>.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:absolute;left:120px;right:120px;bottom:44px;z-index:1;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#8a8987\"><span>ARF AI · Investor Deck<\u002Fspan><span style=\"display:flex;align-items:center;gap:20px\"><span style=\"position:relative;width:160px;height:2px;background:#faf9f71f;overflow:hidden\"><span data-a=\"grow\" style=\"position:absolute;left:0;top:0;bottom:0;width:57.1%;background:linear-gradient(90deg,#3358e8,#7a4be0);transform-origin:left\"><\u002Fspan><\u002Fspan>08 / 14<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Market wedge\" data-screen-label=\"09 Market wedge\" style=\"position:relative;overflow:hidden;box-sizing:border-box;background:#faf9f7;color:#191816;font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;padding:80px 120px 120px\">\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1100px 560px at 18% -10%,#3358e829,#0000 66%),radial-gradient(760px 460px at 92% 20%,#7a4be024,#0000 70%)\"><\u002Fdiv>\n<div style=\"position:relative;z-index:1;height:100%;display:flex;flex-direction:column\">\n<div data-a=\"left\" style=\"display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#605c54;margin-bottom:28px\"><span style=\"width:40px;height:2px;background:linear-gradient(90deg,#3358e8,#7a4be0)\"><\u002Fspan>Initial market wedge<\u002Fdiv>\n<h2 data-a=\"mask\" style=\"margin:0 0 20px;font-size:72px;line-height:1.04;letter-spacing:-.035em;font-weight:600;max-width:1600px;text-wrap:balance\">Start where autonomous mistakes are <em style=\"font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em;background:linear-gradient(100deg,#3358e8,#7a4be0);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em\">expensive<\u002Fem>.<\u002Fh2>\n<p data-a=\"rise\" style=\"margin:0 0 36px;font-size:26px;line-height:1.42;color:#56534d;max-width:1400px;text-wrap:pretty\">ARF is architecture-level infrastructure, but commercialization should begin where organizations already feel the cost of uncontrolled autonomous actions.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-bottom:20px\">\n<div data-a=\"rise\" style=\"background:#fff;border:1px solid #19181617;border-radius:20px;padding:28px;box-shadow:0 2px 4px #19181608,0 20px 44px -28px #1918166b\"><h3 style=\"margin:0 0 12px;font-size:28px;line-height:1.2;font-weight:600;color:#191816\">Cloud infrastructure<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.4;color:#56534d\">Configuration, remediation, incident response, deployments, and privileged operational actions.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#fff;border:1px solid #19181617;border-radius:20px;padding:28px;box-shadow:0 2px 4px #19181608,0 20px 44px -28px #1918166b\"><h3 style=\"margin:0 0 12px;font-size:28px;line-height:1.2;font-weight:600;color:#191816\">Financial services<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.4;color:#56534d\">High-consequence workflows where authorization, risk, and traceability matter.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#fff;border:1px solid #19181617;border-radius:20px;padding:28px;box-shadow:0 2px 4px #19181608,0 20px 44px -28px #1918166b\"><h3 style=\"margin:0 0 12px;font-size:28px;line-height:1.2;font-weight:600;color:#191816\">Healthcare<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.4;color:#56534d\">Controlled workflows where uncertainty and governance requirements are material.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#fff;border:1px solid #19181617;border-radius:20px;padding:28px;box-shadow:0 2px 4px #19181608,0 20px 44px -28px #1918166b\"><h3 style=\"margin:0 0 12px;font-size:28px;line-height:1.2;font-weight:600;color:#191816\">Legal &amp; compliance<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.4;color:#56534d\">AI workflows where evidence, escalation, and auditability are part of the deliverable.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px\">\n<div data-a=\"rise\" style=\"background:#f5f4f1;border:1px dashed #19181633;border-radius:20px;padding:26px 28px\"><h3 style=\"margin:0 0 10px;font-size:28px;line-height:1.2;font-weight:600;color:#191816\">Expansion<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.4;color:#56534d\">Energy, logistics, robotics, and other environments where software-driven decisions affect physical or economic state.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#fff;border:1px solid #19181617;border-radius:20px;padding:26px 28px;box-shadow:0 2px 4px #19181608,0 20px 44px -28px #1918166b\"><h3 style=\"margin:0 0 10px;font-size:28px;line-height:1.2;font-weight:600;color:#191816\">Commercial wedge<\u002Fh3><p style=\"margin:0;font-size:24px;line-height:1.4;color:#56534d\">Infrastructure-agent vendors moving from read-only to production writes, storage first. Second track: agents that make regulated customer commitments (lending, collections, refunds).<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div data-a=\"rise\" style=\"margin-top:auto;padding:22px 36px;border-radius:20px;background:linear-gradient(100deg,#3358e814,#7a4be00f);border:1px solid #3358e833;font-size:26px;line-height:1.4;color:#191816\"><strong style=\"font-weight:600\">Go-to-market principle:<\u002Fstrong> sell first where the cost of one bad autonomous action makes governance a budgeted problem rather than a theoretical one.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:absolute;left:120px;right:120px;bottom:44px;z-index:1;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#605c54\"><span>ARF AI · Investor Deck<\u002Fspan><span style=\"display:flex;align-items:center;gap:20px\"><span style=\"position:relative;width:160px;height:2px;background:#19181617;overflow:hidden\"><span data-a=\"grow\" style=\"position:absolute;left:0;top:0;bottom:0;width:64.3%;background:linear-gradient(90deg,#3358e8,#7a4be0);transform-origin:left\"><\u002Fspan><\u002Fspan>09 / 14<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Business model\" data-screen-label=\"10 Business model\" style=\"position:relative;overflow:hidden;box-sizing:border-box;background:#0e0d12;color:#faf9f7;font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;padding:80px 120px 120px\">\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(900px 420px at 16% 0,#3358e852,#0000 70%),radial-gradient(680px 380px at 92% 100%,#7a4be047,#0000 72%)\"><\u002Fdiv>\n<div style=\"position:relative;z-index:1;height:100%;display:flex;flex-direction:column\">\n<div data-a=\"left\" style=\"display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#9a9997;margin-bottom:28px\"><span style=\"width:40px;height:2px;background:linear-gradient(90deg,#3358e8,#7a4be0)\"><\u002Fspan>Business model<\u002Fdiv>\n<h2 data-a=\"mask\" style=\"margin:0 0 32px;font-size:60px;line-height:1.05;letter-spacing:-.03em;font-weight:600;max-width:1600px;text-wrap:balance\"><em style=\"font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em\">Review-first<\u002Fem> sales with a path to recurring platform revenue.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:24px\">\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:28px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\"><div style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#9a9997;margin-bottom:16px\"><span>Write-access review<\u002Fspan><span>Fixed<\u002Fspan><\u002Fdiv><div data-count=\"\" style=\"font-size:72px;line-height:1;font-weight:600;letter-spacing:-.035em;margin-bottom:16px;background:linear-gradient(100deg,#6d88ff,#a47dff);-webkit-background-clip:text;background-clip:text;color:transparent\">$4,500<\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.4;color:#c4c3c1\">per agent: every write path in the agreed tool inventory, mapped for reversibility and approval.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:28px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\"><div style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#9a9997;margin-bottom:16px\"><span>Continuous gate<\u002Fspan><span>By invitation<\u002Fspan><\u002Fdiv><div data-count=\"\" style=\"font-size:72px;line-height:1;font-weight:600;letter-spacing:-.035em;margin-bottom:16px;background:linear-gradient(100deg,#6d88ff,#a47dff);-webkit-background-clip:text;background-clip:text;color:transparent\">Recurring<span style=\"font-size:36px;letter-spacing:-.01em\"><\u002Fspan><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.4;color:#c4c3c1\">once a write path is modeled; priced per engagement after a validated deployment.<\u002Fp><\u002Fdiv>\n<div data-a=\"rise\" style=\"background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:28px;box-shadow:0 2px 4px #0006,0 20px 44px -28px #000c\"><div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#9a9997;margin-bottom:16px\">Entry<\u002Fdiv><div style=\"font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400;font-size:44px;line-height:1.05;letter-spacing:-.015em;margin-bottom:16px;color:#faf9f7\">Free pilot snapshot<\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.4;color:#c4c3c1\">Five named write tools from one agent, for three founding teams, in exchange for a written reference.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"arf-pipeline arf-pipeline-in\" style=\"display:flex;align-items:stretch\">\n<div data-a=\"rise\" style=\"flex:1;background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:24px 26px\"><div style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;margin-bottom:14px\"><span style=\"color:#9fb0ff\">01<\u002Fspan><span style=\"color:#9a9997;letter-spacing:.1em;text-transform:uppercase\">Land<\u002Fspan><\u002Fdiv><strong style=\"display:block;font-size:28px;line-height:1.2;font-weight:600;margin-bottom:8px\">High-consequence workflow<\u002Fstrong><p style=\"margin:0;font-size:24px;line-height:1.38;color:#c4c3c1\">Start where a governance decision can be observed and measured.<\u002Fp><\u002Fdiv>\n<span class=\"arf-pipeline-wire\" style=\"width:32px;height:2px;margin:0 6px;align-self:center;flex-shrink:0\"><\u002Fspan>\n<div data-a=\"rise\" style=\"flex:1;background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:24px 26px\"><div style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;margin-bottom:14px\"><span style=\"color:#9fb0ff\">02<\u002Fspan><span style=\"color:#9a9997;letter-spacing:.1em;text-transform:uppercase\">Land<\u002Fspan><\u002Fdiv><strong style=\"display:block;font-size:28px;line-height:1.2;font-weight:600;margin-bottom:8px\">Controlled deployment<\u002Fstrong><p style=\"margin:0;font-size:24px;line-height:1.38;color:#c4c3c1\">Use a bounded environment and establish the customer's policy boundary.<\u002Fp><\u002Fdiv>\n<span class=\"arf-pipeline-wire\" style=\"width:32px;height:2px;margin:0 6px;align-self:center;flex-shrink:0\"><\u002Fspan>\n<div data-a=\"rise\" style=\"flex:1;background:#17161d;border:1px solid #faf9f71f;border-radius:20px;padding:24px 26px\"><div style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;margin-bottom:14px\"><span style=\"color:#b9a3ff\">03<\u \" style-hover=\"border-color:#6d88ff\">arf-ai.com<\u002Fa>\n<a href=\"https://www.linkedin.com/in/petterjuan/\" target=\"_blank\" rel=\"noopener\" style=\"padding:16px 28px;border-radius:14px;border:1px solid #faf9f733;background:#17161d;color:#faf9f7;text-decoration:none;font-size:24px;font-weight:600\" style-hover=\"border-color:#6d88ff\">LinkedIn<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<p data-a=\"fade\" style=\"margin:16px 0 0;font-size:24px;line-height:1.4;color:#8a8987\">Non-confidential investor deck · additional technical and IP diligence available through the appropriate process<\u002Fp>\n<\u002Fdiv>\n<div style=\"position:absolute;left:120px;right:120px;bottom:44px;z-index:1;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#8a8987\"><span>© 2026 ARF AI · Current as of Oct 3, 2026<\u002Fspan><span style=\"display:flex;align-items:center;gap:20px\"><span style=\"position:relative;width:160px;height:2px;background:#faf9f71f;overflow:hidden\"><span data-a=\"grow\" style=\"position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#3358e8,#7a4be0);transform-origin:left\"><\u002Fspan><\u002Fspan>14 / 14<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;motion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cinematic&quot;,&quot;subtle&quot;,&quot;off&quot;],&quot;default&quot;:&quot;cinematic&quot;,&quot;tsType&quot;:&quot;'cinematic' | 'subtle' | 'off'&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;ambient&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._loops = [];\n    this._enter = [];\n    this._on = (e) => { const s = e.detail && e.detail.slide; if (s) this.play(s); };\n    document.addEventListener('slidechange', this._on);\n    this._t = setTimeout(() => {\n      this.ambient();\n      const s = document.querySelector('section[data-deck-active]');\n      if (s) this.play(s);\n    }, 150);\n  }\n  componentDidUpdate(prev) {\n    if (prev.ambient !== this.props.ambient || prev.motion !== this.props.motion) this.ambient();\n  }\n  componentWillUnmount() {\n    document.removeEventListener('slidechange', this._on);\n    clearTimeout(this._t);\n    this._loops.forEach(a => a.cancel());\n    this._enter.forEach(a => a.cancel());\n  }\n  mode() {\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return 'off';\n    return this.props.motion || 'cinematic';\n  }\n  ambient() {\n    this._loops.forEach(a => a.cancel());\n    this._loops = [];\n    if (this.props.ambient === false || this.mode() === 'off') return;\n    const loop = (el, kf, o) => this._loops.push(el.animate(kf, Object.assign({ iterations: Infinity, easing: 'ease-in-out' }, o)));\n    document.querySelectorAll('[data-orb]').forEach((el, i) => loop(el, [\n      { transform: 'translate(0px,0px) scale(1)' },\n      { transform: 'translate(' + (i % 2 ? -140 : 160) + 'px,' + (i % 2 ? -90 : 100) + 'px) scale(1.15)' }\n    ], { duration: 11000 + i * 1700, direction: 'alternate' }));\n    document.querySelectorAll('[data-pulse]').forEach(el => loop(el, [\n      { boxShadow: '0 0 0 0px #3358e800, 0 0 40px -16px #3358e866' },\n      { boxShadow: '0 0 0 8px #3358e814, 0 0 90px -10px #7a4be099' }\n    ], { duration: 2400, direction: 'alternate' }));\n    document.querySelectorAll('[data-scan]').forEach(el => loop(el, [\n      { transform: 'translateY(-160px)' }, { transform: 'translateY(760px)' }\n    ], { duration: 4200, easing: 'cubic-bezier(.45,0,.55,1)' }));\n  }\n  frames(m) {\n    const s = m === 'subtle' ? 0.35 : 1;\n    const b = m === 'subtle' ? 0 : 10;\n    const from = (t) => ({ opacity: 0, transform: t, filter: 'blur(' + b + 'px)' });\n    const to = { opacity: 1, transform: 'none', filter: 'blur(0px)' };\n    return {\n      rise: [from('translateY(' + 36 * s + 'px)'), to],\n      up: [from('translateY(' + 70 * s + 'px)'), to],\n      left: [from('translateX(' + -44 * s + 'px)'), to],\n      right: [from('translateX(' + 44 * s + 'px)'), to],\n      scale: [from('scale(' + (1 - 0.08 * s) + ')'), to],\n      glow: [{ opacity: 0, transform: 'scale(' + (1 + 0.06 * s) + ')', filter: 'blur(' + b * 2 + 'px)' }, to],\n      fade: [{ opacity: 0 }, { opacity: 1 }],\n      mask: [{ opacity: 0, clipPath: 'inset(0 0 100% 0)', transform: 'translateY(' + 40 * s + 'px)' }, { opacity: 1, clipPath: 'inset(0 0 0% 0)', transform: 'none' }],\n      grow: [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }]\n    };\n  }\n  play(slide) {\n    this._enter.forEach(a => a.cancel());\n    this._enter = [];\n    const m = this.mode();\n    if (m === 'off') return;\n    const K = this.frames(m);\n    const dur = m === 'subtle' ? 600 : 1000;\n    const step = m === 'subtle' ? 50 : 80;\n    const ease = 'cubic-bezier(.16,1,.3,1)';\n    this._enter.push(slide.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 450, easing: 'ease-out' }));\n    Array.from(slide.querySelectorAll('[data-a]')).forEach((el, i) => {\n      const kf = K[el.dataset.a] || K.rise;\n      const delay = 120 + Math.min(i, 16) * step + (+el.dataset.d || 0);\n      const d = el.dataset.a === 'grow' ? 1400 : el.dataset.a === 'mask' ? dur * 1.1 : dur;\n      this._enter.push(el.animate(kf, { duration: d, delay, easing: ease, fill: 'backwards' }));\n    });\n    Array.from(slide.querySelectorAll('[data-count]')).forEach((el, i) => this.count(el, 350 + i * 120));\n  }\n  count(el, delay) {\n    const node = Array.from(el.childNodes).find(n => n.nodeType === 3);\n    if (!node) return;\n    if (el.__final == null) el.__final = node.nodeValue;\n    const fin = el.__final;\n    const t0 = performance.now() + delay;\n    const dur = 1600;\n    cancelAnimationFrame(el.__raf);\n    const tick = (now) => {\n      const p = Math.max(0, Math.min(1, (now - t0) / dur));\n      const e = 1 - Math.pow(1 - p, 3);\n      node.nodeValue = p >= 1 ? fin : fin.replace(/\\d[\\d,]*/g, (x) => {\n        const v = Math.round(+x.replace(/,/g, '') * e);\n        return x.indexOf(',') >= 0 ? v.toLocaleString('en-US') : String(v);\n      });\n      if (p < 1) el.__raf = requestAnimationFrame(tick);\n    };\n    el.__raf = requestAnimationFrame(tick);\n  }\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
